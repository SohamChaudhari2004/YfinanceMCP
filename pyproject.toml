[project]
name = "stock-ai-api"
version = "1.0.0"
description = "HTTP API for stock data, stock screening and an LLM stock-analysis agent (Groq + yfinance)."
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "slowapi>=0.1.9",
    "langchain>=1.2",
    "langchain-groq>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "yfinance>=1.0",
    "cachetools>=5.3",
    "python-dotenv>=1.0",
    "mcp>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
